name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: 10.0.x
  GITLEAKS_VERSION: v8.30.1
  REGISTRY: ghcr.io

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate solution
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan committed secrets
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          "ghcr.io/gitleaks/gitleaks:${GITLEAKS_VERSION}"
          git --no-banner --redact=100 --verbose /repo

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore VehicleSalesFIAP.slnx

      - name: Verify formatting
        run: dotnet format VehicleSalesFIAP.slnx --verify-no-changes --verbosity minimal --no-restore

      - name: Build
        run: dotnet build VehicleSalesFIAP.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test VehicleSalesFIAP.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Check vulnerable packages
        shell: bash
        run: |
          dotnet list VehicleSalesFIAP.slnx package \
            --vulnerable \
            --include-transitive \
            --format json > vulnerable-packages.json
          cat vulnerable-packages.json
          vulnerability_count="$(jq '[.. | objects | .vulnerabilities? // empty | .[]] | length' vulnerable-packages.json)"
          if [ "$vulnerability_count" -ne 0 ]; then
            echo "::error::$vulnerability_count known NuGet vulnerabilities were found."
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  e2e:
    name: Docker Compose end-to-end
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start complete stack
        run: docker compose up -d --build

      - name: Run Keycloak and SQL Server flow
        shell: pwsh
        run: ./tests/e2e/docker-compose-smoke.ps1

      - name: Show service state
        if: always()
        run: docker compose ps --all

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop complete stack
        if: always()
        run: docker compose down -v --remove-orphans

  container:
    name: Build and publish container image
    runs-on: ubuntu-latest
    needs:
      - validate
      - e2e
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/VehicleSalesFIAP.Api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image summary
        run: |
          {
            echo "### Container image"
            echo ""
            echo "Registry: \`${{ env.REGISTRY }}\`"
            echo "Image: \`${{ env.REGISTRY }}/${{ steps.image.outputs.name }}\`"
            echo ""
            echo "Tags:"
            echo "${{ steps.meta.outputs.tags }}" | sed 's/^/- `/' | sed 's/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
