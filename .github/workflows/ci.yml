name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: 10.0.x
  GITLEAKS_VERSION: v8.30.1
  REGISTRY: ghcr.io

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate solution
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan committed secrets
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          "ghcr.io/gitleaks/gitleaks:${GITLEAKS_VERSION}"
          git --no-banner --redact=100 --verbose /repo

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore VehicleSalesFIAP.slnx

      - name: Verify formatting
        run: dotnet format VehicleSalesFIAP.slnx --verify-no-changes --verbosity minimal --no-restore

      - name: Validate production deployment files
        shell: bash
        run: |
          export PUBLIC_HOST=vehiclesalesfiap.example.com
          export API_IMAGE=ghcr.io/example/vehiclesalesfiap
          export IMAGE_TAG=0123456789012345678901234567890123456789
          export SQLSERVER_DATABASE=VehicleSalesFIAP
          export SQLSERVER_SA_PASSWORD=validation-only
          export KEYCLOAK_DB_NAME=keycloak
          export KEYCLOAK_DB_USERNAME=keycloak
          export KEYCLOAK_DB_PASSWORD=validation-only
          export KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME=validation
          export KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD=validation-only
          docker compose -f compose.prod.yml config --quiet
          bash -n infra/deploy/bootstrap-vm.sh
          bash -n infra/deploy/deploy.sh
          jq empty infra/keycloak/realm-production.json

      - name: Build
        run: dotnet build VehicleSalesFIAP.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test VehicleSalesFIAP.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Check vulnerable packages
        shell: bash
        run: |
          dotnet list VehicleSalesFIAP.slnx package \
            --vulnerable \
            --include-transitive \
            --format json > vulnerable-packages.json
          cat vulnerable-packages.json
          vulnerability_count="$(jq '[.. | objects | .vulnerabilities? // empty | .[]] | length' vulnerable-packages.json)"
          if [ "$vulnerability_count" -ne 0 ]; then
            echo "::error::$vulnerability_count known NuGet vulnerabilities were found."
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  e2e:
    name: Docker Compose end-to-end
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start complete stack
        run: docker compose up -d --build

      - name: Run Keycloak and SQL Server flow
        shell: pwsh
        run: ./tests/e2e/docker-compose-smoke.ps1

      - name: Show service state
        if: always()
        run: docker compose ps --all

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop complete stack
        if: always()
        run: docker compose down -v --remove-orphans

  container:
    name: Build and publish container image
    runs-on: ubuntu-latest
    needs:
      - validate
      - e2e
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract migrations image metadata
        id: migrations-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch,prefix=migrations-
            type=ref,event=pr,prefix=migrations-
            type=semver,pattern={{version}},prefix=migrations-
            type=semver,pattern={{major}}.{{minor}},prefix=migrations-
            type=sha,prefix=migrations-sha-
            type=raw,value=migrations-${{ github.sha }}
            type=raw,value=migrations-latest,enable={{is_default_branch}}

      - name: Build and optionally push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/VehicleSalesFIAP.Api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and optionally push migrations image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/migrations/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.migrations-meta.outputs.tags }}
          labels: ${{ steps.migrations-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image summary
        run: |
          {
            echo "### Container images"
            echo ""
            echo "Registry: \`${{ env.REGISTRY }}\`"
            echo "API: \`${{ env.REGISTRY }}/${{ steps.image.outputs.name }}\`"
            echo "Migrations: \`${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:migrations-<tag>\`"
            echo ""
            echo "API tags:"
            echo "${{ steps.meta.outputs.tags }}" | sed 's/^/- `/' | sed 's/$/`/'
            echo ""
            echo "Migrations tags:"
            echo "${{ steps.migrations-meta.outputs.tags }}" | sed 's/^/- `/' | sed 's/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: container
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    timeout-minutes: 20
    environment:
      name: production
      url: https://${{ vars.PUBLIC_HOST }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy immutable revision to VM
        shell: bash
        run: |
          deployment_output="$(
            az vm run-command invoke \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_VM_NAME }}" \
              --command-id RunShellScript \
              --scripts @infra/deploy/deploy.sh \
              --parameters "$GITHUB_SHA" "$GITHUB_REPOSITORY" \
              --query "value[0].message" \
              --output tsv
          )"
          printf '%s\n' "$deployment_output"
