# Local development and demonstration only. All fallback credentials below are public examples.
name: vehiclesalesfiap

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
  ConnectionStrings__VehicleSales: Server=sqlserver,1433;Database=${SQLSERVER_DATABASE:-VehicleSalesFIAP};User Id=sa;Password=${SQLSERVER_SA_PASSWORD:-VehicleSalesFIAP@12345};TrustServerCertificate=True
  Authentication__Authority: http://keycloak:8080/realms/vehiclesalesfiap
  Authentication__Audience: vehiclesalesfiap-api
  Authentication__RequireHttpsMetadata: "false"
  Authentication__ValidIssuers__0: http://keycloak:8080/realms/vehiclesalesfiap
  Authentication__ValidIssuers__1: http://localhost:8081/realms/vehiclesalesfiap

services:
  api:
    build:
      context: .
      dockerfile: src/VehicleSalesFIAP.Api/Dockerfile
    container_name: vehiclesalesfiap-api
    environment:
      <<: *api-environment
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/localhost/8080; printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"'"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  migrations:
    build:
      context: .
      dockerfile: infra/migrations/Dockerfile
    container_name: vehiclesalesfiap-migrations
    environment:
      <<: *api-environment
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
    container_name: vehiclesalesfiap-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:-VehicleSalesFIAP@12345}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"${SQLSERVER_SA_PASSWORD:-VehicleSalesFIAP@12345}\" -Q \"SELECT 1\" -b -o /dev/null"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: vehiclesalesfiap-keycloak
    command: start-dev --import-realm --http-port=8080 --hostname-strict=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-admin}
    ports:
      - "8081:8080"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/localhost/8080; printf \"GET /realms/vehiclesalesfiap/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"'"
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

volumes:
  sqlserver_data:
  keycloak_data:
